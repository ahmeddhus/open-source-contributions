name: Update open source contributions

on:
  workflow_dispatch: # run by hand: Actions tab -> "Update open source contributions" -> Run workflow

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add newly merged PRs to README
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        # use --mode profile in ahmeddhus/ahmeddhus
        # use --mode portfolio in ahmeddhus/open-source-contributions
        run: python3 scripts/update_contributions.py --mode portfolio

      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "README already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "docs: add newly merged open source PRs"
          git push
